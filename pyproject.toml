[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-evidence-engine"
version = "0.1.0"
description = "Evaluate whether a control register has owned, current, available, and unaltered artifacts ready for auditor review."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
audit-evidence = "audit_evidence:main"

[tool.setuptools]
py-modules = ["audit_evidence"]
